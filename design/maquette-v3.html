<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Poulpe, espace de travail</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Bricolage+Grotesque:opsz,wght@12..96,300..800&family=Caveat:wght@400..700&family=DM+Serif+Display:ital@0;1&family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=Instrument+Sans:ital,wght@0,400..700;1,400..700&family=JetBrains+Mono:wght@400..700&family=Lora:ital,wght@0,400..700;1,400..700&family=Montserrat:ital,wght@0,300..800;1,300..800&family=Oswald:wght@300..700&family=Pacifico&family=Permanent+Marker&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap">
<style>
/* Layout : fenêtre d'application de bureau façon Affinity. Barre de titre + menus, barre d'outils principale, barre contextuelle,
   colonne d'outils, onglets de documents + règles + canevas, Studio à droite (groupes d'onglets), Studio Ressources à gauche, barre d'état. */
:root{
  --win:#1A1A1D; --bg:#202024; --panel:#2A2A2F; --panel-2:#323238; --input:#1E1E22; --line:#3A3A41; --line-2:#4A4A52;
  --fg:#E7E6EC; --muted:#A3A1AC; --faint:#73717C;
  --accent:#FF5F86; --accent-hi:#FF7C9C; --accent-fg:#1A0C12; --accent-soft:rgba(255,95,134,.16);
  --sel:#4DA3FF; --pasteboard:#151518; --guide:#FF4FB8; --ruler:#26262B; --tick:#6E6C78;
  --shadow:0 18px 50px rgba(0,0,0,.55),0 2px 8px rgba(0,0,0,.4);
  --ui:"Instrument Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --display:"Bricolage Grotesque","Instrument Sans",ui-sans-serif,system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --win:#C9C8CF; --bg:#D6D5DB; --panel:#E4E3E8; --panel-2:#EDECF1; --input:#F7F7FA; --line:#C4C3CB; --line-2:#B2B0BA;
  --fg:#1C1B22; --muted:#5E5C68; --faint:#8C8A96;
  --accent:#C8325A; --accent-hi:#DD4570; --accent-fg:#FFFFFF; --accent-soft:rgba(200,50,90,.12);
  --sel:#1F7BEF; --pasteboard:#BDBCC4; --guide:#D21F8C; --ruler:#DCDBE1; --tick:#85838F;
  --shadow:0 18px 50px rgba(30,25,45,.25),0 2px 8px rgba(30,25,45,.15); color-scheme:light}}
:root[data-theme="light"]{
  --win:#C9C8CF; --bg:#D6D5DB; --panel:#E4E3E8; --panel-2:#EDECF1; --input:#F7F7FA; --line:#C4C3CB; --line-2:#B2B0BA;
  --fg:#1C1B22; --muted:#5E5C68; --faint:#8C8A96;
  --accent:#C8325A; --accent-hi:#DD4570; --accent-fg:#FFFFFF; --accent-soft:rgba(200,50,90,.12);
  --sel:#1F7BEF; --pasteboard:#BDBCC4; --guide:#D21F8C; --ruler:#DCDBE1; --tick:#85838F;
  --shadow:0 18px 50px rgba(30,25,45,.25),0 2px 8px rgba(30,25,45,.15); color-scheme:light}

html,body{height:100%}
body{background:var(--win);color:var(--fg);font:12px/1.35 var(--ui);overflow:hidden;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
button:disabled{cursor:default}
:focus-visible{outline:2px solid var(--sel);outline-offset:1px;border-radius:4px}
svg.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.num,.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

#app{height:100%;display:grid;grid-template-rows:32px 40px 34px minmax(0,1fr) 24px;gap:1px;background:var(--win)}
/* Barre de titre */
#titlebar{display:flex;align-items:center;gap:4px;background:var(--win);padding-inline:8px 0;min-width:0;user-select:none}
.appicon{width:20px;height:20px;flex:none}
.menubar{display:flex}
.menubar>button{padding:4px 8px;border-radius:5px;color:var(--fg);opacity:.85}
.menubar>button:hover,.menubar>button[aria-expanded="true"]{background:var(--panel-2);opacity:1}
.wtitle{flex:1;text-align:center;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.wtitle b{color:var(--fg);font-weight:600}
.winctl{display:flex;height:100%}
.winctl button{width:44px;height:100%;display:grid;place-items:center;color:var(--muted)}
.winctl button:hover{background:var(--panel-2);color:var(--fg)}
.winctl button.close:hover{background:#D9304A;color:#fff}
/* Barre d'outils principale */
#toolbar{display:flex;align-items:center;gap:2px;background:var(--panel);padding-inline:8px;min-width:0;overflow-x:auto;scrollbar-width:none}
#toolbar::-webkit-scrollbar{display:none}
.personas{display:flex;gap:2px;padding:3px;background:var(--input);border-radius:8px;margin-right:6px}
.persona{width:30px;height:26px;border-radius:6px;display:grid;place-items:center;color:var(--muted)}
.persona:hover{color:var(--fg)}
.persona[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
.ib{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:6px;color:var(--muted);flex:none}
.ib:hover:not(:disabled){background:var(--panel-2);color:var(--fg)}
.ib:disabled{opacity:.35}
.ib.on,.ib[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.tsep{width:1px;height:22px;background:var(--line);margin-inline:6px;flex:none}
.spacer{flex:1}
.btn{display:inline-flex;align-items:center;gap:6px;height:28px;padding-inline:10px;border-radius:6px;font-weight:600;white-space:nowrap;flex:none}
.btn.primary{background:var(--accent);color:var(--accent-fg)}
.btn.primary:hover{background:var(--accent-hi)}
.btn.ghost{border:1px solid var(--line-2);color:var(--fg)}
.btn.ghost:hover{background:var(--panel-2)}
.lang{font:600 11px var(--mono);width:auto;padding-inline:8px}
/* Barre contextuelle */
#ctxbar{display:flex;align-items:center;gap:8px;background:var(--panel-2);padding-inline:10px;min-width:0;overflow-x:auto;scrollbar-width:none;white-space:nowrap}
#ctxbar::-webkit-scrollbar{display:none}
.ctxlab{color:var(--faint);font-size:11px}
.ctxname{font-weight:600;color:var(--fg);padding-right:4px}
.cf{display:inline-flex;align-items:center;gap:6px}
/* Zone de travail */
#work{display:grid;gap:1px;min-height:0;background:var(--win)}
#tools{grid-area:tools;background:var(--panel);display:flex;flex-direction:column;align-items:center;gap:2px;padding-block:8px;z-index:3;overflow-y:auto;scrollbar-width:none}
.tool{position:relative;width:34px;height:32px;border-radius:6px;display:grid;place-items:center;color:var(--muted);flex:none}
.tool:hover{background:var(--panel-2);color:var(--fg)}
.tool[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
.tool::after{content:"";position:absolute;right:3px;bottom:3px;border:2.5px solid transparent;border-right-color:currentColor;border-bottom-color:currentColor;opacity:.35}
.tools-gap{height:1px;width:22px;background:var(--line);margin-block:4px;flex:none}
.colorchips{position:relative;width:34px;height:40px;margin-top:6px;flex:none}
.colorchips .cfill,.colorchips .cstroke{position:absolute;width:22px;height:22px;border-radius:50%;box-shadow:0 0 0 1px var(--line-2)}
.colorchips .cfill{left:2px;top:2px;z-index:2}
.colorchips .cstroke{right:2px;bottom:2px;background:transparent}
.colorchips .cstroke i{position:absolute;inset:4px;border-radius:50%;background:var(--panel)}
[data-tip]{position:relative}
[data-tip]:hover::after{content:attr(data-tip);position:absolute;left:calc(100% + 8px);top:50%;transform:translateY(-50%);background:#000;color:#fff;font:500 11.5px/1 var(--ui);padding:6px 8px;border-radius:5px;white-space:nowrap;pointer-events:none;z-index:60;border:0;opacity:1}
#app[data-tools="right"] #tools [data-tip]:hover::after{left:auto;right:calc(100% + 8px)}
#toolbar [data-tip]:hover::after,#titlebar [data-tip]:hover::after,#ctxbar [data-tip]:hover::after{left:50%;top:calc(100% + 6px);transform:translateX(-50%)}
.studio{background:var(--panel);display:flex;flex-direction:column;min-height:0;min-width:0;position:relative;gap:1px}
#lstudio{grid-area:left}
#rstudio{grid-area:right;background:var(--win)}
.sgroup{background:var(--panel);display:flex;flex-direction:column;min-height:0;flex:1 1 0}
.sgroup.collapsed{flex:0 0 auto}
.sgroup[hidden]{display:none}
.stabs{display:flex;align-items:center;gap:1px;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;min-width:0;background:var(--panel-2);padding:3px 4px 0;min-height:28px;flex:none}
.stabs button.tab{padding:5px 9px 6px;border-radius:5px 5px 0 0;color:var(--muted);font-weight:500;font-size:11.5px;white-space:nowrap}
.stabs button.tab:hover{color:var(--fg)}
.stabs button.tab[aria-selected="true"]{background:var(--panel);color:var(--fg)}
.stabs .grow{flex:1}
.stabs .ib{width:22px;height:22px}
.sbody{overflow:auto;min-height:0;flex:1}
.sgroup.collapsed .sbody{display:none}
.pad{padding:10px;display:grid;gap:9px}
.sec{padding:9px 10px;border-top:1px solid var(--line);display:grid;gap:7px}
.sec:first-child{border-top:0}
.lbl{font:600 10.5px var(--ui);letter-spacing:.06em;text-transform:uppercase;color:var(--faint);display:flex;justify-content:space-between;align-items:center}
.lbl small{text-transform:none;letter-spacing:0;font-weight:500}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.row{display:flex;align-items:center;gap:6px;min-width:0}
.fld{display:flex;align-items:center;height:24px;border-radius:5px;background:var(--input);border:1px solid var(--line);min-width:0}
.fld:hover{border-color:var(--line-2)}
.fld:focus-within{border-color:var(--sel)}
.fld .scrub{flex:none;padding-inline:6px 2px;color:var(--faint);font:500 10.5px var(--mono);cursor:ew-resize;user-select:none;min-width:18px;white-space:nowrap}
.fld input,.fld select{border:0;background:transparent;outline:none;width:100%;min-width:0;height:100%;padding-inline:3px 6px;font:500 11.5px var(--mono);font-variant-numeric:tabular-nums}
.fld select{font-family:var(--ui);font-size:11.5px;padding-inline:6px;cursor:pointer}
.fld select option{background:var(--panel);color:var(--fg)}
.fld .u{color:var(--faint);font:10.5px var(--mono);padding-right:6px}
.fld.w60{width:64px;flex:none}.fld.w80{width:84px;flex:none}.fld.w120{width:124px;flex:none}.fld.w170{width:170px;flex:none}
.txtfld{width:100%;height:24px;border-radius:5px;background:var(--input);border:1px solid var(--line);padding-inline:7px}
.txtfld:focus{border-color:var(--sel);outline:none}
textarea.txtfld{height:auto;padding-block:5px;resize:vertical;min-height:48px}
.seg{display:flex;background:var(--input);border:1px solid var(--line);border-radius:6px;padding:1px;gap:1px}
.seg button{flex:1;height:22px;min-width:24px;border-radius:4px;display:grid;place-items:center;color:var(--muted);padding-inline:4px}
.seg button:hover:not(:disabled){color:var(--fg)}
.seg button[aria-pressed="true"]{background:var(--panel-2);color:var(--fg);box-shadow:inset 0 0 0 1px var(--line-2)}
.seg button.txt{font:500 11px var(--ui)}
.seg svg.i{width:14px;height:14px}
.note{color:var(--muted);font-size:11.5px;margin:0}
input[type=range]{flex:1;min-width:0;accent-color:var(--accent);height:16px}
.switch{display:flex;align-items:center;justify-content:space-between;gap:8px;cursor:pointer}
.switch input{appearance:none;width:26px;height:15px;border-radius:99px;background:var(--line-2);position:relative;cursor:pointer;flex:none;transition:background .15s}
.switch input::after{content:"";position:absolute;top:2px;left:2px;width:11px;height:11px;border-radius:50%;background:#fff;transition:transform .15s}
.switch input:checked{background:var(--accent)}
.switch input:checked::after{transform:translateX(11px)}
.check{display:flex;align-items:center;gap:6px;cursor:pointer}
.check input{accent-color:var(--accent);margin:0}
.checker{background-color:#fff;background-image:conic-gradient(#cfcdd6 25%,#fff 0 50%,#cfcdd6 0 75%,#fff 0);background-size:8px 8px}
.swatch{position:relative;width:24px;height:24px;border-radius:5px;flex:none;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(0,0,0,.3),0 0 0 1px var(--line-2)}
.swatch span{position:absolute;inset:0;border-radius:inherit}
.swatch.round{border-radius:50%}
.swatch.none span{background:linear-gradient(135deg,transparent 45%,#E5334F 45% 55%,transparent 55%),#fff!important}
.swatch.stroke span::after{content:"";position:absolute;inset:5px;border-radius:inherit;background:var(--panel-2);box-shadow:0 0 0 1px rgba(0,0,0,.25)}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chips button{width:18px;height:18px;border-radius:4px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.25)}
.chips button:hover{transform:scale(1.15)}
.gbar{height:18px;border-radius:4px;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(0,0,0,.2)}
.stops{display:grid;gap:5px}
.color{display:flex;align-items:center;gap:6px;min-width:0}
.color .fld{flex:1}
/* Panneau Couleur */
.cpair{position:relative;width:58px;height:50px;flex:none}
.cpair button.c{position:absolute;width:34px;height:34px;border-radius:50%;overflow:hidden;box-shadow:0 0 0 1px var(--line-2)}
.cpair .cf{left:0;top:0}.cpair .cs{right:0;bottom:0}
.cpair button.c.active{box-shadow:0 0 0 2px var(--sel)}
.cpair button.c.front{z-index:2}
.cpair .cs span::after{content:"";position:absolute;inset:8px;border-radius:50%;background:var(--panel);box-shadow:0 0 0 1px rgba(0,0,0,.3)}
.cpair .swap{position:absolute;right:-2px;top:-2px;width:18px;height:18px;color:var(--muted)}
.cpair .swap svg{width:12px;height:12px}
.wheel{position:relative;width:min(100%,196px);aspect-ratio:1;margin:2px auto 0;border-radius:50%;background:conic-gradient(from 0deg,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00);touch-action:none;cursor:crosshair}
.wheel::before{content:"";position:absolute;inset:14px;border-radius:50%;background:var(--panel)}
.wheel .sq{position:absolute;inset:25%;border-radius:3px}
.wheel i{position:absolute;width:12px;height:12px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.6);transform:translate(-50%,-50%);pointer-events:none;z-index:2}
.slid{display:grid;grid-template-columns:14px 1fr 46px;align-items:center;gap:6px}
.slid b{font:600 10.5px var(--mono);color:var(--faint)}
.slid .track{position:relative;height:12px;border-radius:99px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.25)}
.slid .track input{position:absolute;inset:-3px 0;width:100%;opacity:0;cursor:pointer;margin:0}
.slid .track i{position:absolute;top:50%;width:10px;height:14px;border-radius:3px;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.5);transform:translate(-50%,-50%);pointer-events:none}
.slid .fld{height:22px}
/* Calques */
.lhead{display:flex;gap:6px;padding:6px 8px;border-bottom:1px solid var(--line);align-items:center}
.lhead .fld:first-child{flex:1}
#layers{list-style:none;margin:0;padding:3px 0}
.layer{display:flex;align-items:center;gap:7px;height:38px;padding-inline:6px 6px;color:var(--fg);cursor:default;user-select:none;border-left:2px solid transparent}
.layer:hover{background:var(--panel-2)}
.layer.sel{background:var(--accent-soft);border-left-color:var(--accent)}
.layer.hidden .lname,.layer.hidden .lthumb{opacity:.4}
.lthumb{width:30px;height:30px;border-radius:4px;flex:none;overflow:hidden;box-shadow:inset 0 0 0 1px var(--line-2)}
.lthumb svg{width:100%;height:100%;display:block}
.lname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lname small{color:var(--faint);margin-left:4px}
.lname input{width:100%;height:22px;border:1px solid var(--sel);border-radius:4px;background:var(--input);padding-inline:4px}
.layer .fx{font:700 9.5px var(--mono);color:var(--accent);border:1px solid currentColor;border-radius:3px;padding:0 3px}
.layer .lb{width:22px;height:22px;border-radius:4px;display:grid;place-items:center;color:var(--faint)}
.layer .lb:hover{color:var(--fg);background:var(--line)}
.layer .lb svg{width:13px;height:13px}
.layer .vis{appearance:none;width:13px;height:13px;border-radius:3px;border:1.5px solid var(--faint);cursor:pointer;flex:none;margin:0 3px}
.layer .vis:checked{background:var(--sel);border-color:var(--sel);box-shadow:inset 0 0 0 2px var(--panel)}
.layer.dragover-top{box-shadow:inset 0 2px 0 var(--sel)}
.layer.dragover-bot{box-shadow:inset 0 -2px 0 var(--sel)}
.lfoot{display:flex;gap:1px;padding:3px 6px;border-top:1px solid var(--line);background:var(--panel-2);flex:none}
.lfoot .ib{width:26px;height:24px}
.lfoot svg{width:14px;height:14px}
.fxrow{border-top:1px solid var(--line);padding:7px 10px;display:grid;gap:7px}
.fxrow .check{font-weight:600}
/* Transformation */
.anchor{display:grid;grid-template-columns:repeat(3,12px);grid-template-rows:repeat(3,12px);gap:3px;padding:4px;background:var(--input);border:1px solid var(--line);border-radius:5px;flex:none}
.anchor button{width:12px;height:12px;border-radius:2px;border:1.5px solid var(--line-2)}
.anchor button[aria-pressed="true"]{background:var(--sel);border-color:var(--sel)}
/* Historique et navigateur */
.hist{list-style:none;margin:0;padding:3px 0}
.hist button{display:flex;width:100%;align-items:center;gap:8px;padding:5px 10px;text-align:left;color:var(--fg)}
.hist button:hover{background:var(--panel-2)}
.hist button.cur{background:var(--accent-soft);color:var(--accent);font-weight:600}
.hist button.future{color:var(--faint)}
.nav{position:relative;margin:10px;background:var(--pasteboard);border-radius:5px;display:grid;place-items:center;padding:10px;cursor:pointer;touch-action:none}
.nav svg{max-width:100%;max-height:150px;display:block}
.nav .vr{position:absolute;border:1.5px solid #E5334F;pointer-events:none;border-radius:2px}
/* Centre */
#center{grid-area:canvas;display:grid;grid-template-rows:28px 18px minmax(0,1fr);grid-template-columns:18px minmax(0,1fr);grid-template-areas:"tabs tabs" "corner hr" "vr canvas";min-width:0;min-height:0;background:var(--win)}
#center.norulers{grid-template-rows:28px 0 minmax(0,1fr);grid-template-columns:0 minmax(0,1fr)}
#doctabs{grid-area:tabs;display:flex;align-items:flex-end;gap:1px;background:var(--panel-2);padding-inline:6px 6px;min-width:0;overflow:hidden}
.dtab{display:flex;align-items:center;gap:7px;height:24px;padding-inline:10px 4px;border-radius:6px 6px 0 0;background:var(--bg);color:var(--fg);max-width:320px;min-width:0}
.dtab span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dtab .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);flex:none}
.dtab .ib{width:18px;height:18px}
.dtab .ib svg{width:11px;height:11px}
#doctabs>.ib{width:22px;height:22px;margin-bottom:1px}
.rcorner{grid-area:corner;background:var(--ruler)}
#hr{grid-area:hr;width:100%;height:100%;display:block;background:var(--ruler)}
#vr{grid-area:vr;width:100%;height:100%;display:block;background:var(--ruler)}
#center.norulers .rcorner,#center.norulers #hr,#center.norulers #vr{display:none}
#canvasWrap{grid-area:canvas;position:relative;overflow:hidden;background:var(--pasteboard);touch-action:none}
#stage{position:absolute;inset:0;width:100%;height:100%;display:block}
#stage.t-hand,#stage.panning{cursor:grab}
#stage.panning:active{cursor:grabbing}
#stage.t-rect,#stage.t-ellipse,#stage.t-pen,#stage.t-pencil,#stage.t-line,#stage.t-star,#stage.t-pipette,#stage.t-brush,#stage.t-eraser,#stage.t-fill,#stage.t-slice{cursor:crosshair}
#stage.t-text{cursor:text}
#stage.t-zoom{cursor:zoom-in}
#stage.t-image{cursor:copy}
.h-nw,.h-se{cursor:nwse-resize}.h-ne,.h-sw{cursor:nesw-resize}.h-n,.h-s{cursor:ns-resize}.h-e,.h-w{cursor:ew-resize}.h-rot{cursor:grab}
#editor{position:absolute;margin:0;padding:0;border:0;outline:none;background:transparent;resize:none;overflow:hidden;white-space:pre;transform-origin:center;caret-color:var(--sel)}
/* Ressources */
.libtabs{display:flex;gap:1px;background:var(--panel-2);padding:3px 4px 0;flex:none}
.lib{padding:10px;display:grid;gap:9px}
.tplgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tpl{display:flex;flex-direction:column;gap:4px;text-align:left;border-radius:6px;padding:5px;border:1px solid transparent}
.tpl:hover{border-color:var(--line-2);background:var(--panel-2)}
.tpl .thumb{aspect-ratio:1;max-width:100%;border-radius:4px;background:var(--pasteboard);display:grid;place-items:center;overflow:hidden}
.tpl .thumb svg{max-width:86%;max-height:86%;box-shadow:0 2px 10px rgba(0,0,0,.3)}
.tpl b{font-weight:600}
.tpl small{color:var(--faint);font:10.5px var(--mono)}
.libh{font:600 10.5px var(--ui);letter-spacing:.06em;text-transform:uppercase;color:var(--faint);margin-top:2px}
.shpgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.shp{aspect-ratio:1;border-radius:6px;background:var(--input);display:grid;place-items:center;border:1px solid var(--line)}
.shp:hover{border-color:var(--accent)}
.shp svg{width:56%;height:56%}
.txtp{display:block;width:100%;text-align:left;padding:8px 10px;border-radius:6px;background:var(--input);border:1px solid var(--line)}
.txtp:hover{border-color:var(--accent)}
.dropz{border:1.5px dashed var(--line-2);border-radius:8px;padding:12px;text-align:center;color:var(--muted)}
.dropz button{color:var(--accent);font-weight:600}
.palrow{display:flex;gap:4px}
.palrow button{flex:1;height:24px;border-radius:4px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.2)}
.resizer{position:absolute;top:0;bottom:0;width:6px;cursor:col-resize;z-index:6}
.resizer:hover,.resizer.on{background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
/* Barre d'état */
#status{display:flex;align-items:center;gap:14px;padding-inline:10px;background:var(--panel);color:var(--muted);font-size:11.5px;min-width:0}
#status .hint{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
#status b{color:var(--fg);font-weight:600}
#status .num{font-size:11px;white-space:nowrap}
/* Menus, popovers, modales */
.menu{position:fixed;z-index:80;min-width:250px;background:var(--panel);border:1px solid var(--line-2);border-radius:7px;box-shadow:var(--shadow);padding:4px}
.menu button{display:flex;width:100%;align-items:center;gap:10px;padding:5px 10px;border-radius:4px;text-align:left}
.menu button:hover:not(:disabled),.menu button.act{background:var(--sel);color:#fff}
.menu button:hover:not(:disabled) .kbd{color:#fff;border-color:rgba(255,255,255,.5);background:transparent}
.menu button:disabled{opacity:.4}
.menu button .ck{flex:none}
.menu .ck{width:12px;color:var(--accent)}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 6px}
.kbd{font:500 10.5px var(--mono);color:var(--muted);border:1px solid var(--line-2);border-radius:4px;padding:0 4px;white-space:nowrap}
.cpop{position:fixed;z-index:85;width:248px;background:var(--panel);border:1px solid var(--line-2);border-radius:9px;box-shadow:var(--shadow);padding:10px;display:grid;gap:9px}
.sv{position:relative;height:140px;border-radius:6px;cursor:crosshair;touch-action:none}
.sv i,.hue i,.alp i{position:absolute;width:13px;height:13px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.5);transform:translate(-50%,-50%);pointer-events:none}
.hue,.alp{position:relative;height:11px;border-radius:99px;cursor:pointer;touch-action:none}
.hue{background:linear-gradient(90deg,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00)}
.alp span{position:absolute;inset:0;border-radius:inherit}
.hue i,.alp i{top:50%}
.scrim{position:fixed;inset:0;background:rgba(5,4,10,.5);z-index:90;display:grid;place-items:start center;padding:10vh 16px 16px}
.dialog{width:min(560px,100%);background:var(--panel);border:1px solid var(--line-2);border-radius:10px;box-shadow:var(--shadow);overflow:hidden}
.dialog header{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--line)}
.dialog header h2{margin:0;font:700 15px var(--display)}
.dialog .body{padding:14px;display:grid;gap:12px;max-height:64vh;overflow:auto}
.dialog footer{display:flex;justify-content:flex-end;gap:8px;padding:10px 14px;border-top:1px solid var(--line);background:var(--panel-2)}
#palInput{width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;padding:14px;font-size:14px;outline:none}
#palList{max-height:50vh;overflow:auto;padding:5px;margin:0;list-style:none}
#palList li button{display:flex;width:100%;align-items:center;gap:10px;padding:7px 10px;border-radius:6px;text-align:left}
#palList li button span:nth-child(2){flex:1}
#palList li button.act{background:var(--accent-soft)}
#palList li button svg{color:var(--muted)}
.keys{display:grid;grid-template-columns:1fr 1fr;gap:3px 22px}
.keys div{display:flex;justify-content:space-between;align-items:center;gap:10px;padding-block:3px;border-bottom:1px solid var(--line)}
.keys h4{grid-column:1/-1;margin:8px 0 2px;font:600 10.5px var(--ui);letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
.expv{display:grid;place-items:center;background:var(--pasteboard);border-radius:8px;padding:14px;min-height:170px}
.expv svg{max-height:190px;max-width:100%;box-shadow:0 4px 18px rgba(0,0,0,.3)}
.custlist{list-style:none;margin:0;padding:0;display:grid;gap:3px}
.custlist li{display:flex;align-items:center;gap:8px;padding:4px 8px;border-radius:6px;background:var(--panel-2)}
.custlist li.off{opacity:.55}
.custlist li>span:nth-child(2){flex:1}
.custlist .ib{width:24px;height:24px}
.opt{display:grid;gap:7px}
.layoutpick{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.layoutpick button{border:1px solid var(--line);border-radius:8px;padding:8px;display:grid;gap:6px;text-align:center;font-weight:500}
.layoutpick button[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent);color:var(--accent)}
.layoutpick svg{width:100%;height:auto}
.install{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.install svg.big{width:56px;height:56px}
.oslist{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.oslist div{border:1px solid var(--line);border-radius:8px;padding:10px;display:grid;gap:3px}
.oslist small{color:var(--faint);font:10.5px var(--mono)}
.toast{position:fixed;left:50%;bottom:40px;transform:translateX(-50%);background:#000;color:#fff;padding:8px 13px;border-radius:7px;font-weight:500;z-index:100;box-shadow:var(--shadow);max-width:calc(100% - 32px);transition:opacity .2s}
.mobile-only{display:none}

@media (max-width:1100px){.menubar>button:nth-child(n+6){display:none}}
@media (max-width:820px){
  #app{grid-template-rows:44px 38px minmax(0,1fr)!important;grid-template-areas:"title" "ctx" "work"!important}
  #titlebar{padding-inline:16px}
  .menubar,.winctl,#status,#toolbar{display:none}
  .wtitle{text-align:left}
  .mobile-only{display:inline-flex}
  #work{grid-template-columns:minmax(0,1fr)!important;grid-template-rows:minmax(0,1fr) 54px!important;grid-template-areas:"canvas" "tools"!important}
  #titlebar{grid-area:title}#ctxbar{grid-area:ctx;padding-inline:16px}#work{grid-area:work}
  #tools{grid-area:tools;flex-direction:row;overflow-x:auto;padding:8px 16px;padding-bottom:calc(8px + env(safe-area-inset-bottom,0px));gap:3px}
  #tools .colorchips{margin:0 0 0 6px;height:34px}
  .tools-gap{width:1px;height:22px;margin-inline:4px}
  [data-tip]:hover::after{display:none}
  #center{grid-template-rows:28px 0 minmax(0,1fr)!important;grid-template-columns:0 minmax(0,1fr)!important}
  #center .rcorner,#hr,#vr{display:none}
  .studio{position:fixed;left:0;right:0;bottom:54px;height:62%;z-index:40;border-radius:14px 14px 0 0;box-shadow:var(--shadow);display:none!important;overflow:auto}
  .studio.open{display:flex!important}
  .resizer{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

  `<button class="btn ghost" data-close>${t("cancel")}</button><button class="btn primary" id="instGo">${ic("install")}${t("installBtn")}</button>`),m=>{m.querySelector(".install svg").style.cssText="width:56px;height:56px;fill:none;stroke:var(--accent);stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round";m.querySelector("#instGo").onclick=()=>{closeModal();toast(t("installed"))}})}
function openExport(){let fmt="PNG",scale=2,area="doc";const draw=m=>{const name=(doc.name||"poulpe").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
    m.querySelector("#expSeg").innerHTML=["PNG","JPG","WEBP","SVG","PDF"].map(f=>`<button class="txt" data-fmt="${f}" aria-pressed="${f===fmt}">${f}</button>`).join("");
    m.querySelector("#expScale").innerHTML=[1,2,3].map(s=>`<button class="txt" data-sc="${s}" aria-pressed="${s===scale}" ${fmt==="SVG"||fmt==="PDF"?"disabled":""}>${s}×</button>`).join("");
    m.querySelector("#expArea").innerHTML=[["doc","areaDoc"],["sel","areaSel"]].map(([k,l])=>`<button class="txt" data-area="${k}" aria-pressed="${area===k}" ${k==="sel"&&!sel.size?"disabled":""}>${t(l)}</button>`).join("");
    const b=area==="sel"&&sel.size?bbox(selected()):{w:doc.w,h:doc.h};m.querySelector("#expInfo").textContent=`${name}.${fmt.toLowerCase()} · ${fmt==="SVG"||fmt==="PDF"?Math.round(b.w)+" × "+Math.round(b.h)+" pt":Math.round(b.w*scale)+" × "+Math.round(b.h*scale)+" px"}`;m._file=`${name}.${fmt.toLowerCase()}`};
  openModal(dlg(t("exportTitle"),`<div class="expv">${docSVG(doc)}</div><div class="opt"><span class="lbl">${t("exportFmt")}</span><div class="seg" id="expSeg"></div></div><div class="g2"><div class="opt"><span class="lbl">${t("exportScale")}</span><div class="seg" id="expScale"></div></div><div class="opt"><span class="lbl">${t("exportArea")}</span><div class="seg" id="expArea"></div></div></div>
    <span class="num" id="expInfo"></span><p class="note">${t("exportNote")}</p>`,`<button class="btn ghost" data-close>${t("cancel")}</button><button class="btn primary" id="expGo">${ic("export")}${t("exportTitle")}</button>`),m=>{draw(m);
    m.addEventListener("click",e=>{const f=e.target.closest("[data-fmt]"),s=e.target.closest("[data-sc]"),a=e.target.closest("[data-area]");if(f){fmt=f.dataset.fmt;draw(m)}if(s&&!s.disabled){scale=+s.dataset.sc;draw(m)}if(a&&!a.disabled){area=a.dataset.area;draw(m)}if(e.target.closest("#expGo")){closeModal();toast(t("exported",{f:m._file}))}})})}
function openCustomize(){const draw=m=>{const b=m.querySelector(".body"),sc=b.scrollTop;
  const mini=side=>`<svg viewBox="0 0 120 64" aria-hidden="true"><rect x=".5" y=".5" width="119" height="63" rx="6" fill="var(--panel-2)" stroke="var(--line)"/><rect x="${side==="left"?6:106}" y="6" width="8" height="52" rx="2" fill="var(--accent)"/><rect x="${side==="left"?18:6}" y="6" width="20" height="52" rx="2" fill="var(--line-2)"/><rect x="${side==="left"?94:80}" y="6" width="20" height="52" rx="2" fill="var(--line-2)"/></svg>`;
  b.innerHTML=`<div class="opt"><span class="lbl">${t("toolbar")}</span><div class="layoutpick">${["left","right"].map(s=>`<button data-l-tools="${s}" aria-pressed="${layout.tools===s}">${mini(s)}${t(s)}</button>`).join("")}</div></div>
    <div class="opt"><span class="lbl">${t("panelsL")}</span><label class="switch"><span>${t("showRes")}</span><input type="checkbox" data-l="showLeft" ${layout.showLeft?"checked":""}></label><label class="switch"><span>${t("showProps")}</span><input type="checkbox" data-l="showRight" ${layout.showRight?"checked":""}></label>
      ${Object.keys(GROUPS).map(g=>`<label class="switch" style="padding-left:14px"><span>${t("showGroup",{x:GROUPS[g].map(k=>t("p_"+k)).join(", ")})}</span><input type="checkbox" data-gv="${g}" ${layout.groups[g].vis?"checked":""}></label>`).join("")}
      <label class="switch"><span>${t("swapPanels")}</span><input type="checkbox" data-l="swap" ${layout.swap?"checked":""}></label><label class="switch"><span>${t("cmd_rulers")}</span><input type="checkbox" data-l="rulers" ${layout.rulers?"checked":""}></label><p class="note">${t("resizeNote")}</p></div>
    <div class="opt"><span class="lbl">${t("shownTools",{p:t("ps_"+persona)})}</span><p class="note">${t("toolsNote")}</p><ul class="custlist">${(()=>{const pt=personaTools();return pt.map((k,i)=>{const on=!layout.hidden.includes(k);return`<li class="${on?"":"off"}">${ic(TOOLDEF[k][0])}<span>${t("tool_"+k)}</span><span class="kbd">${TOOLDEF[k][1]}</span>
      <button class="ib" data-mv="${k}:-1" ${i?"":"disabled"} aria-label="${t("moveUp")}">${ic("up")}</button><button class="ib" data-mv="${k}:1" ${i<pt.length-1?"":"disabled"} aria-label="${t("moveDown")}">${ic("down")}</button><label class="switch"><input type="checkbox" data-tv="${k}" ${on?"checked":""} ${k==="select"?"disabled":""} aria-label="${t("tool_"+k)}"></label></li>`}).join("")})()}</ul></div>`;b.scrollTop=sc};
  const upd=m=>{saveLayout();applyLayout();draw(m)};
  openModal(dlg(t("customTitle"),"",`<button class="btn ghost" id="lReset">${t("reset")}</button><button class="btn primary" data-close>${t("done")}</button>`),m=>{draw(m);
    m.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;
      if(b.dataset.lTools){layout.tools=b.dataset.lTools;upd(m)}
      else if(b.dataset.mv){const[k,d]=b.dataset.mv.split(":"),pt=personaTools(),i=pt.indexOf(k),other=pt[i+ +d];if(!other)return;const o=layout.order,a=o.indexOf(k),c=o.indexOf(other);[o[a],o[c]]=[o[c],o[a]];upd(m)}
      else if(b.id==="lReset"){layout=JSON.parse(JSON.stringify(LAYOUT_DEF));upd(m)}});
    m.addEventListener("change",e=>{const c=e.target;if(c.dataset.l){layout[c.dataset.l]=c.checked;upd(m)}if(c.dataset.gv){layout.groups[c.dataset.gv].vis=c.checked;upd(m)}if(c.dataset.tv){const k=c.dataset.tv;layout.hidden=c.checked?layout.hidden.filter(x=>x!==k):[...layout.hidden,k];upd(m)}})})}

/* ================= Clavier ================= */
const typing=()=>{const a=document.activeElement;return a&&(a.tagName==="INPUT"||a.tagName==="TEXTAREA"||a.tagName==="SELECT"||a.isContentEditable)};
document.addEventListener("keydown",e=>{const m=e.metaKey||e.ctrlKey,k=e.key;
  if(modal){if(k==="Escape")closeModal();return}
  if(m&&k.toLowerCase()==="k"){e.preventDefault();openPalette();return}
  if(typing())return;
  if(picker&&k==="Escape"){closePicker();return}
  if(k===" "&&!spaceDown){spaceDown=true;stage.classList.add("panning");e.preventDefault();return}
  if(m){const kl=k.toLowerCase();const map={z:e.shiftKey?"redo":"undo",y:"redo",j:"dup",a:"all",d:"none",e:e.shiftKey?"export":null,l:"lock",n:"new","0":"fit","1":"z100","=":"zin","+":"zin","-":"zout",h:e.shiftKey?"hide":null,r:"rulers",i:e.shiftKey?"invert":"italic",u:"underline",g:e.shiftKey?"import":"group","]":e.shiftKey?"front":"fwd","[":e.shiftKey?"back":"bwd","}":"front","{":"back",p:e.altKey?"docsetup":null};
    const c=map[kl];if(c){e.preventDefault();runCmd(c)}return}
  if(k==="Tab"&&!e.shiftKey){e.preventDefault();runCmd("focus");return}
  if(tool==="pen"&&(k==="Enter"||k==="Escape")){k==="Enter"?finishPen(false):(penPts=[],renderOverlay());return}
  if(k==="Escape"){closeMenus();if(sel.size)runCmd("none");else setTool("select");return}
  if(k==="Delete"||k==="Backspace"){e.preventDefault();runCmd("del");return}
  if(k==="?"){runCmd("keys");return}
  if(k==="x"||k==="X"){if(!e.altKey){const L=selected();if(!L.length){const f=solidOf(D.fill);D.fill=D.stroke;D.stroke=f;renderChrome(true)}else{ctarget=ctarget==="fill"?"stroke":"fill";renderStudio(true)}return}}
  if((k==="["||k==="]")&&(tool==="brush"||tool==="eraser")){const p=tool==="brush"?"brushW":"eraserW";D[p]=clamp(D[p]+(k==="]"?4:-4),1,400);renderCtx(true);renderOverlay();return}
  if(k==="Enter"&&sel.size===1&&sel1().type==="text"){e.preventDefault();startEdit(sel1());return}
  if(k.startsWith("Arrow")&&sel.size){e.preventDefault();const s=e.shiftKey?10:1,dx=k==="ArrowLeft"?-s:k==="ArrowRight"?s:0,dy=k==="ArrowUp"?-s:k==="ArrowDown"?s:0;mutate(()=>{for(const o of selected())if(!o.locked){o.x=r1(o.x+dx);o.y=r1(o.y+dy)}},"nudge");return}
  const kl=k.toLowerCase(),tk=PERSONAS[persona].tools.find(x=>TOOLDEF[x]&&TOOLDEF[x][1].toLowerCase()===kl)||(kl==="o"&&PERSONAS[persona].tools.includes("ellipse")?"ellipse":null);
  if(tk&&!e.altKey){if(tk==="image"){pendingImage={};$("#fileIn").click();return}setTool(tk)}});
document.addEventListener("keyup",e=>{if(e.key===" "){spaceDown=false;if(tool!=="hand")stage.classList.remove("panning")}});

/* ================= Divers ================= */
$("#btnLeftM").onclick=()=>runCmd("studioL");$("#btnRightM").onclick=()=>runCmd("studioR");$("#btnExportM").onclick=()=>openExport();
function closeSheets(){$("#lstudio").classList.remove("open");$("#rstudio").classList.remove("open")}
let theme=store.get("poulpe.theme")||"dark";
function applyTheme(){const r=document.documentElement;if(theme==="system")r.removeAttribute("data-theme");else r.setAttribute("data-theme",theme)}
function cycleTheme(){theme={system:"light",light:"dark",dark:"system"}[theme];store.set("poulpe.theme",theme);applyTheme();renderToolbar();drawRulers();toast(t("theme_"+theme))}
function setLang(l){lang=l;store.set("poulpe.lang",l);document.documentElement.lang=l;renderMenubar();renderToolbar();renderLib();renderAll(true);setTool(tool)}
let toastEl=null,toastT;
function toast(msg){if(!toastEl){toastEl=document.createElement("div");toastEl.className="toast";toastEl.setAttribute("role","status");document.body.appendChild(toastEl)}toastEl.textContent=msg;toastEl.style.opacity=1;clearTimeout(toastT);toastT=setTimeout(()=>toastEl.style.opacity=0,2800)}
function updateStatus(){$("#selInfo").textContent=sel.size?t("selN",{n:sel.size}):t("noSel");$("#abInfo").textContent=`${doc.w} × ${doc.h} px · ${doc.dpi||72} dpi`;
  const u=$("#btnUndo"),r=$("#btnRedo");if(u)u.disabled=!undoStack.length;if(r)r.disabled=!redoStack.length}
function renderDocTabs(){const fname=esc(doc.name)+".poulpe";$("#doctabs").innerHTML=`<div class="dtab" title="${fname}"><span class="dot" title="•"></span><span>${fname}</span><button class="ib" data-cmd="close" aria-label="${t("cmd_close")}">${ic("close")}</button></div><button class="ib" data-cmd="new" aria-label="${t("cmd_new")}" title="${t("cmd_new")}">${ic("plus")}</button>`;
  $("#wtitle").innerHTML=`<b>Poulpe</b> — ${fname} <span style="color:var(--faint)">(${Math.round(zoom*100)} %)</span>`}
$("#doctabs").addEventListener("click",e=>{const b=e.target.closest("[data-cmd]");if(b)runCmd(b.dataset.cmd)});
function renderAll(force){for(const id of[...sel])if(!byId(id))sel.delete(id);renderCanvas();renderChrome(force);updateStatus();renderDocTabs()}

document.documentElement.lang=lang;applyTheme();renderMenubar();renderToolbar();applyLayout();setTool("select");renderLib();renderAll(true);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{for(const o of doc.objects)measure(o);renderAll(true);renderLib()});
})();
</script>
