[package]
name = "poulpe"
version = "0.4.0"
description = "Poulpe, application libre de création graphique"
authors = ["Contributeurs de Poulpe"]
license = "MPL-2.0"
repository = "https://github.com/KAYO74/Poulpe"
edition = "2021"
rust-version = "1.77"

[lib]
name = "poulpe_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
fontdb = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
