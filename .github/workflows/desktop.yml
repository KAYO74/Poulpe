name: Installeurs de bureau

# Produit les installeurs Windows (.msi, .exe), macOS (.dmg) et Linux (.deb, AppImage).
# Sur une étiquette `v*` (par exemple `git tag v0.2.0 && git push origin v0.2.0`), ils sont publiés
# dans une version GitHub, sous des noms sans numéro de version pour que les liens de téléchargement
# du README (`releases/latest/download/...`) restent valables d'une version à l'autre.
# Une étiquette avec un tiret (`v0.2.0-beta.1`) donne une préversion, qui ne remplace pas la dernière version.
# Sans étiquette, les installeurs sont gardés en artefacts du workflow.
on:
  workflow_dispatch:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - 'apps/desktop/**'
      - '.github/workflows/desktop.yml'

env:
  RELEASE_BODY: |
    Téléchargez l'installeur de votre système ci-dessous, ou suivez le guide : [Installer Poulpe](https://github.com/${{ github.repository }}/blob/main/docs/installer.md).

    | Système | Fichier |
    | --- | --- |
    | Windows | `Poulpe_windows_x64-setup.exe` (ou `.msi`) |
    | macOS (puces Apple M1 à M4) | `Poulpe_darwin_aarch64.dmg` |
    | macOS (Intel) | `Poulpe_darwin_x64.dmg` |
    | Linux (Ubuntu, Debian) | `Poulpe_linux_amd64.deb` |
    | Linux (autres distributions) | `Poulpe_linux_amd64.AppImage` |

    L'appli n'est pas encore signée : Windows et macOS affichent un avertissement au premier lancement. Le guide explique comment l'ouvrir quand même.

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-22.04
            args: ''
          - name: Windows
            os: windows-latest
            args: ''
          - name: macOS (Apple Silicon)
            os: macos-latest
            args: --target aarch64-apple-darwin
          - name: macOS (Intel)
            os: macos-latest
            args: --target x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Dépendances système de Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: pnpm install --frozen-lockfile
      - uses: tauri-apps/tauri-action@v0
        id: tauri
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          args: ${{ matrix.args }}
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && format('Poulpe {0}', github.ref_name) || '' }}
          releaseBody: ${{ startsWith(github.ref, 'refs/tags/') && env.RELEASE_BODY || '' }}
          releaseDraft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          assetNamePattern: Poulpe_[platform]_[arch][setup][ext]
      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          name: poulpe-${{ runner.os }}-${{ strategy.job-index }}
          path: |
            apps/desktop/src-tauri/target/**/release/bundle/**/*.deb
            apps/desktop/src-tauri/target/**/release/bundle/**/*.AppImage
            apps/desktop/src-tauri/target/**/release/bundle/**/*.msi
            apps/desktop/src-tauri/target/**/release/bundle/**/*.exe
            apps/desktop/src-tauri/target/**/release/bundle/**/*.dmg
          retention-days: 14
